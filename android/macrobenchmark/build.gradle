plugins {
  id 'com.android.test'
  id 'kotlin-android'
}

android {
  namespace "com.truckercore.macrobenchmark"
  compileSdk 34

  defaultConfig {
    minSdk 28
    targetSdk 34
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  targetProjectPath ':app'

  buildTypes {
    release { debuggable = true }
    debug { debuggable = true }
  }

  testOptions {
    managedDevices {
      devices {
        pixel6Api34(com.android.build.api.dsl.ManagedVirtualDevice) {
          device = "Pixel 6"
          apiLevel = 34
          systemImageSource = "aosp"
        }
      }
    }
  }
}

dependencies {
  implementation "androidx.test.ext:junit:1.1.5"
  implementation "androidx.test.espresso:espresso-core:3.5.1"
  implementation "androidx.benchmark:benchmark-macro-junit4:1.2.4"
  implementation "androidx.profileinstaller:profileinstaller:1.3.1"
  implementation "androidx.test.uiautomator:uiautomator:2.3.0"
}

// Task to copy generated baseline-prof.txt into the baselineprofile module
// Try the common AGP 8+ path first; fallback glob covers managed devices output

tasks.register("copyBaselineProfile", Copy) {
  def outputsDir = file("${buildDir}")
  from(outputsDir) {
    include "outputs/**/baseline-prof.txt"
    include "managed_device_android_test_additional_output/**/baseline-prof.txt"
  }
  into project(":baselineprofile").file("src/main/baseline")
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
