name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Android Lint
        working-directory: android
        run: ./gradlew lint

      - name: Assemble Debug (dev)
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew assembleDevDebug

      - name: Bundle Release (prod)
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DEV_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          DEV_SUPABASE_KEY: ${{ secrets.DEV_SUPABASE_KEY }}
          DEV_MAPS_KEY: ${{ secrets.DEV_MAPS_KEY }}
          DEV_STRIPE_PK: ${{ secrets.DEV_STRIPE_PK }}
          STAGE_SUPABASE_URL: ${{ secrets.STAGE_SUPABASE_URL }}
          STAGE_SUPABASE_KEY: ${{ secrets.STAGE_SUPABASE_KEY }}
          STAGE_MAPS_KEY: ${{ secrets.STAGE_MAPS_KEY }}
          STAGE_STRIPE_PK: ${{ secrets.STAGE_STRIPE_PK }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_KEY: ${{ secrets.PROD_SUPABASE_KEY }}
          PROD_MAPS_KEY: ${{ secrets.PROD_MAPS_KEY }}
          PROD_STRIPE_PK: ${{ secrets.PROD_STRIPE_PK }}
        run: ./gradlew bundleProdRelease

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            android/app/build/outputs/apk/**
            android/app/build/outputs/bundle/**
