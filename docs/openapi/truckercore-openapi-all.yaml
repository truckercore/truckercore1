openapi: 3.0.3
info:
  title: TruckerCore Unified API (Consolidated)
  version: 1.0.0
servers:
  - url: https://{env}.yourdomain.com
    variables:
      env:
        default: stage
        enum: [stage, app]
tags:
  - name: Analytics
  - name: Owner-Operator
  - name: HOS & Compliance
  - name: Inspections & Maintenance
  - name: Alerts & Exceptions
  - name: AI Assistant
  - name: AI Routing
  - name: Vetting & Trust
  - name: Pricing & Forecasts
  - name: Marketplace
  - name: Claims
  - name: Safety & Coaching
  - name: Billing & Invoicing
  - name: Offline & Navigation
  - name: Enterprise & Admin
  - name: Integrations (ELD/Accounting/Loadboard)
  - name: Security, Fraud & Audits
  - name: Localization & Accessibility
  - name: Sustainability
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    AnalyticsKpis:
      type: object
      properties:
        loads: { type: integer }
        miles: { type: number }
        revenue: { type: number }
        cost: { type: number }
        avg_ppm: { type: number, nullable: true }
        on_time_pct: { type: number, nullable: true }
      required: [loads, miles, revenue, cost]
    AnalyticsSeriesPoint:
      type: object
      properties:
        date: { type: string, format: date }
        loads: { type: integer }
        miles: { type: number }
        avg_ppm: { type: number, nullable: true }
        on_time_pct: { type: number, nullable: true }
    AnalyticsResponse:
      type: object
      properties:
        kpis: { $ref: '#/components/schemas/AnalyticsKpis' }
        series:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsSeriesPoint' }
    OwnerOpExpense:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        load_id: { type: string, format: uuid, nullable: true }
        category: { type: string, enum: [fuel,tolls,repairs,tires,insurance,permits,parking,detention,lumper,other] }
        amount_usd: { type: number }
        miles: { type: number, nullable: true }
        notes: { type: string, nullable: true }
        incurred_on: { type: string, format: date }
        created_at: { type: string, format: date-time }
    OwnerOpProfitResponse:
      type: object
      properties:
        totals:
          type: object
          properties:
            revenue_usd: { type: number }
            expense_usd: { type: number }
            miles: { type: number }
            net_usd: { type: number }
            cpm_net: { type: number, nullable: true }
        breakdown:
          type: object
          additionalProperties: { type: number }
    HosLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        driver_user_id: { type: string, format: uuid }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status: { type: string, enum: [off,sleeper,driving,on] }
    InspectionReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        driver_user_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        type: { type: string, enum: [pre_trip,post_trip] }
        defects:
          type: array
          items:
            type: object
            properties:
              component: { type: string }
              severity: { type: string, enum: [minor,major] }
              note: { type: string, nullable: true }
        certified_safe: { type: boolean }
        signed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    AlertEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        severity: { type: string, enum: [info,warning,critical] }
        code: { type: string, enum: [LATE_ETA,HOS_NEAR_LIMIT,INSPECTION_WEEK] }
        payload: { type: object }
        triggered_at: { type: string, format: date-time }
        acknowledged: { type: boolean }
        acknowledged_by:
          type: string
          format: uuid
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
    VettingResult:
      type: object
      properties:
        dot_number: { type: string }
        mc_number: { type: string, nullable: true }
        authority_status: { type: string, enum: [active,inactive,pending,unknown] }
        safety_rating: { type: string, enum: [satisfactory,conditional,unsatisfactory,unknown] }
        insurance_expiry: { type: string, format: date, nullable: true }
        fraud_flag: { type: boolean }
        reasons: { type: array, items: { type: string } }
        last_verified_at: { type: string, format: date-time }
    BehaviorSummary:
      type: object
      properties:
        driver_user_id: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        counts_by_type:
          type: object
          additionalProperties: { type: integer }
        recent:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              occurred_at: { type: string, format: date-time }
              details: { type: object }
        demo: { type: boolean }
    ScorecardV2:
      type: object
      properties:
        driver_user_id: { type: string }
        period: { type: string, example: '30d' }
        score: { type: number, minimum: 0, maximum: 100 }
        metrics:
          type: object
          properties:
            speeding: { type: integer }
            harsh_brake: { type: integer }
            harsh_accel: { type: integer }
            cornering: { type: integer }
            dwell_over_sla: { type: integer }
            on_time_pct: { type: number }
        streaks:
          type: object
          properties:
            on_time_days: { type: integer }
            no_speeding_days: { type: integer }
        peer_rank:
          type: object
          properties:
            percentile: { type: number }
            group_size: { type: integer }
    CoachingTask:
      type: object
      properties:
        id: { type: string }
        driver_user_id: { type: string }
        metric: { type: string, enum: [speeding, harsh_brake, harsh_accel, cornering, on_time_pct] }
        context: { type: object }
        due_by: { type: string, format: date-time }
        status: { type: string, enum: [open, completed, dismissed] }
        ack_notes: { type: string, nullable: true }
    MaintenanceSchedule:
      type: object
      properties:
        vehicle_id: { type: string }
        schedule: { type: string }
        next_due: { type: string, format: date }
        due_in_miles: { type: number, nullable: true }
        due_in_days: { type: number, nullable: true }
        overdue: { type: boolean }
    WorkOrder:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [open,in_progress,completed,cancelled] }
        vehicle_id: { type: string }
        tasks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string, enum: [pending,done] }
        created_at: { type: string, format: date-time }
    TrihaulResponse:
      type: object
      properties:
        itineraries:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              legs:
                type: array
                items:
                  type: object
                  properties:
                    origin_zip: { type: string }
                    dest_zip: { type: string }
                    est_miles: { type: number }
                    est_rate_ppm: { type: number }
              est_miles_total: { type: number }
              est_revenue_total: { type: number }
              est_ppm: { type: number }
              score: { type: number }
              reasons: { type: array, items: { type: string } }
        generated_at: { type: string, format: date-time }
    EtaPredictResponse:
      type: object
      properties:
        legs:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              eta_p50_minutes: { type: integer }
              eta_p80_minutes: { type: integer }
              reasons: { type: array, items: { type: string } }
        total:
          type: object
          properties:
            p50_minutes: { type: integer }
            p80_minutes: { type: integer }
            risk: { type: string, enum: [none,low,medium,high] }
    RouteOptimizeResponse:
      type: object
      properties:
        ordered_stops: { type: array, items: { type: string } }
        summary:
          type: object
          properties:
            total_miles: { type: number }
            eta_minutes: { type: number }
            windows_met: { type: boolean }
            notes: { type: array, items: { type: string } }
        segments:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              polyline: { type: string }
              eta_minutes: { type: number }
    ParkingSuggestion:
      type: object
      properties:
        name: { type: string }
        lat: { type: number }
        lng: { type: number }
        availability_confidence: { type: number }
        fit_score: { type: number }
        phone: { type: string, nullable: true }
    CostsEstimate:
      type: object
      properties:
        lane_key: { type: string }
        est_fuel_usd: { type: number }
        est_tolls_usd: { type: number }
        cpm_cost: { type: number }
        assumptions:
          type: object
          properties:
            mpg: { type: number }
            fuel_price_usd_per_gal: { type: number }
            toll_coverage_pct: { type: number }
    BrokerTrust:
      type: object
      properties:
        broker_id: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        reasons: { type: array, items: { type: string } }
        last_updated: { type: string, format: date-time }
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        actor: { type: string }
        created_at: { type: string, format: date-time }
        payload: { type: object }
    ApiKey:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked: { type: boolean }
    WebhookConfig:
      type: object
      properties:
        id: { type: string }
        event: { type: string }
        url: { type: string }
        secret: { type: string }
        created_at: { type: string, format: date-time }
    OfflineTilesManifest:
      type: object
      properties:
        region_key: { type: string }
        version: { type: integer }
        size_bytes: { type: integer }
        parts:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              size: { type: integer }
        checksum: { type: string }
    Poi:
      type: object
      properties:
        id: { type: string }
        lat: { type: number }
        lng: { type: number }
        type: { type: string, enum: [weigh_station,low_clearance,restricted_route,parking,service] }
        props: { type: object }
        version: { type: integer }
    NotificationPref:
      type: object
      properties:
        channel: { type: string, enum: [email,push,sms] }
        topic: { type: string, enum: [marketplace,claims,chat,dispatch,billing,alerts] }
        enabled: { type: boolean }
    ModerationFlag:
      type: object
      properties:
        id: { type: string }
        subject_type: { type: string, enum: [chat_message,listing,profile] }
        subject_id: { type: string }
        reason: { type: string }
        severity: { type: string, enum: [low,medium,high] }
        status: { type: string, enum: [open,reviewed,actioned,dismissed] }
        created_at: { type: string, format: date-time }
    EmissionsReport:
      type: object
      properties:
        scope: { type: string, enum: [trip, period, org] }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        total_co2e_kg: { type: number }
        breakdown:
          type: array
          items:
            type: object
            properties:
              load_id: { type: string }
              miles: { type: number }
              fuel_gal: { type: number }
              co2e_kg: { type: number }
security:
  - bearerAuth: []
paths:
  # Analytics
  /api/analytics/fleet:
    get:
      tags: [Analytics]
      summary: Fleet analytics KPIs and time series
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
          required: true
        - in: query
          name: to
          schema: { type: string, format: date }
          required: true
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsResponse' } } } }
  /api/analytics/broker:
    get:
      tags: [Analytics]
      summary: Broker analytics KPIs and time series
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
          required: true
        - in: query
          name: to
          schema: { type: string, format: date }
          required: true
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsResponse' } } } }
  /api/analytics/export.csv:
    get:
      tags: [Analytics]
      summary: Export analytics as CSV
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [fleet,broker] }
          required: true
        - in: query
          name: from
          schema: { type: string, format: date }
          required: true
        - in: query
          name: to
          schema: { type: string, format: date }
          required: true
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string, format: binary } } } }

  # Owner-Operator
  /api/ownerop/expenses:
    post:
      tags: [Owner-Operator]
      summary: Create an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, amount_usd, incurred_on]
              properties:
                load_id: { type: string, format: uuid }
                category: { type: string, enum: [fuel,tolls,repairs,tires,insurance,permits,parking,detention,lumper,other] }
                amount_usd: { type: number }
                miles: { type: number }
                notes: { type: string }
                incurred_on: { type: string, format: date }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerOpExpense' } } } }
  /api/ownerop/profit:
    get:
      tags: [Owner-Operator]
      summary: Owner-Operator profit summary
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
          required: true
        - in: query
          name: to
          schema: { type: string, format: date }
          required: true
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerOpProfitResponse' } } } }
  /api/ownerop/tax/export.csv:
    get:
      tags: [Owner-Operator]
      summary: Export quarterly CSV for taxes
      parameters:
        - in: query
          name: quarter
          schema: { type: string, example: 'Q3-2025' }
          required: true
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string, format: binary } } } }

  # HOS & Compliance
  /api/hos/{driver_user_id}:
    get:
      tags: [HOS & Compliance]
      summary: Get HOS logs (7–30 days)
      parameters:
        - in: path
          name: driver_user_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/HosLog' }
  /api/compliance/hos/export.csv:
    get:
      tags: [HOS & Compliance]
      summary: Export HOS CSV
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string, format: binary } } } }

  # Inspections & Maintenance
  /api/inspection:
    post:
      tags: [Inspections & Maintenance]
      summary: Submit pre/post trip inspection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, type, defects, certified_safe, signed_at]
              properties:
                vehicle_id: { type: string, format: uuid }
                type: { type: string, enum: [pre_trip,post_trip] }
                defects:
                  type: array
                  items:
                    type: object
                    properties:
                      component: { type: string }
                      severity: { type: string, enum: [minor,major] }
                      note: { type: string }
                certified_safe: { type: boolean }
                signed_at: { type: string, format: date-time }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/InspectionReport' } } } }
  /api/maintenance/schedules:
    get:
      tags: [Inspections & Maintenance]
      summary: Get maintenance schedules
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [upcoming,overdue,all] }
        - in: query
          name: within_days
          schema: { type: integer, default: 30 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MaintenanceSchedule' } } } } } } }
  /api/maintenance/workorders:
    post:
      tags: [Inspections & Maintenance]
      summary: Create work order (from DVIR or manual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id]
              properties:
                vehicle_id: { type: string }
                source: { type: string, enum: [dvir,manual], default: manual }
                defects:
                  type: array
                  items:
                    type: object
                    properties:
                      component: { type: string }
                      severity: { type: string, enum: [minor,major] }
                      note: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrder' } } } }

  # Alerts & Exceptions
  /api/alerts:
    get:
      tags: [Alerts & Exceptions]
      summary: List current alerts for org
      parameters:
        - in: query
          name: code
          schema: { type: string, enum: [LATE_ETA,HOS_NEAR_LIMIT,INSPECTION_WEEK] }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AlertEvent' } } } } }
  /api/alerts/{id}/ack:
    post:
      tags: [Alerts & Exceptions]
      summary: Acknowledge an alert
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { acknowledged: { type: boolean } } } } } }

  # AI Assistant
  /api/ai_assistant:
    post:
      tags: [AI Assistant]
      summary: Role-aware AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, prompt]
              properties:
                role: { type: string, enum: [driver, ownerop, fleet_manager, broker] }
                prompt: { type: string }
                driver_user_id: { type: string, format: uuid }
                load_id: { type: string, format: uuid }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { answer: { type: string } } } } } }

  # AI Routing (ETA, Optimize, Parking, Tri-haul, Costs)
  /api/ai/eta_predict:
    post:
      tags: [AI Routing]
      summary: Predict ETA with P50/P80 per leg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                origin: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
                dest: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
                departure_time: { type: string, format: date-time }
                polyline: { type: string }
                truck: { type: object }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EtaPredictResponse' } } } }
  /api/ai/route_optimize:
    post:
      tags: [AI Routing]
      summary: Optimize multi-stop route with constraints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stops]
              properties:
                stops: { type: array, items: { type: object } }
                truck: { type: object }
                constraints: { type: object }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RouteOptimizeResponse' } } } }
  /api/ai/parking_suggest:
    get:
      tags: [AI Routing]
      summary: HOS-aware parking suggestions
      parameters:
        - in: query
          name: lat
          schema: { type: number }
          required: true
        - in: query
          name: lng
          schema: { type: number }
          required: true
        - in: query
          name: hos_remaining
          schema: { type: integer }
          required: true
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ParkingSuggestion' } } } } }
  /api/trihaul/suggest:
    post:
      tags: [AI Routing, Pricing & Forecasts]
      summary: Suggest profit-optimized tri-hauls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin_zip, dest_zip, date, equipment]
              properties:
                origin_zip: { type: string }
                dest_zip: { type: string }
                date: { type: string, format: date }
                equipment: { type: string }
                constraints: { type: object }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrihaulResponse' } } } }
  /api/costs/estimate:
    get:
      tags: [AI Routing, Owner-Operator]
      summary: Estimate fuel/toll costs and CPM impact
      parameters:
        - in: query
          name: lane_key
          schema: { type: string }
          required: true
        - in: query
          name: equipment
          schema: { type: string }
          required: true
        - in: query
          name: weight
          schema: { type: number }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CostsEstimate' } } } }

  # Vetting & Trust
  /api/vetting/lookup:
    get:
      tags: [Vetting & Trust]
      summary: Lookup DOT/MC/authority/insurance/safety
      parameters:
        - in: query
          name: dot
          schema: { type: string }
        - in: query
          name: mc
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VettingResult' } } } }
  /api/broker/trust/{broker_id}:
    get:
      tags: [Vetting & Trust]
      summary: Broker trust score and reasons
      parameters:
        - in: path
          name: broker_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BrokerTrust' } } } }
  /api/audit/event:
    post:
      tags: [Security, Fraud & Audits]
      summary: Append audit event (service role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
