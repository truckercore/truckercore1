openapi: 3.0.3
info: { title: TruckerCore Phase 22–23 API, version: 1.0.0 }
servers: [ { url: https://{env}.yourdomain.com, variables: { env: { default: stage, enum: [stage, app] } } } ]
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  schemas:
    MaintForecast:
      type: object
      properties: { vehicle_id: {type: string}, horizon_days: {type: integer}, series: {type: array, items: {type: object, properties: { date: {type: string, format: date}, failure_prob: {type:number}, recommended: {type:boolean} }}} }
    DockAppt:
      type: object
      properties: { id: {type:string}, site_id: {type:string}, dock_id: {type:string}, load_id: {type:string}, window: {type:object, properties:{ start:{type:string,format:date-time}, end:{type:string,format:date-time} }}, status: {type:string, enum: [tentative, confirmed, conflict]} }
    ReconResult:
      type: object
      properties: { run_id: {type:string}, matched: {type:integer}, partial: {type:integer}, unmatched: {type:integer}, items: {type: array, items: {type: object}} }
    KycStatus:
      type: object
      properties: { subject_id: {type:string}, status: {type:string, enum: [pending, approved, rejected]}, reasons: {type: array, items: {type: string}}, required_docs: {type: array, items: {type:string}} }
    SavedChart:
      type: object
      properties: { id: {type:string}, title: {type:string}, query: {type:object}, owner_org: {type:string}, shared_with: {type:array, items:{type:string}} }
security: [ { bearerAuth: [] } ]
paths:
  /api/maintenance/forecast:
    get:
      summary: Predictive maintenance forecast per vehicle
      parameters: [ { in: query, name: vehicle_id, required: true, schema: {type:string} }, { in: query, name: horizon_days, schema: {type: integer, default: 30} } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MaintForecast' } } } } }
  /api/dock/appointments:
    post:
      summary: Create dock appointment (conflict-aware)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [site_id,dock_id,window], properties: { site_id:{type:string}, dock_id:{type:string}, load_id:{type:string}, window:{type:object,properties:{start:{type:string,format:date-time},end:{type:string,format:date-time}}} } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DockAppt' }}}}, '409': { description: Conflict } }
  /api/finance/recon/run:
    post:
      summary: Run finance reconciliation
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { from:{type:string,format:date}, to:{type:string,format:date}, strategy:{type:string, enum:[strict, forgiving]} } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReconResult' }}}}}
  /api/kyc/start:
    post:
      summary: Start KYC/KYB verification
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { subject_id:{type:string}, subject_type:{type:string, enum:[broker,carrier]}, email:{type:string}, phone:{type:string} }}}}}
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KycStatus' }}}}}
  /api/kyc/status/{subject_id}:
    get:
      summary: Fetch KYC/KYB status
      parameters: [ { in: path, name: subject_id, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KycStatus' }}}}}
  /api/analytics/saved_charts:
    post:
      summary: Create saved chart
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SavedChart' } } } }
      responses: { '200': { description: OK } }
    get:
      summary: List saved charts
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SavedChart' } } } } } }
