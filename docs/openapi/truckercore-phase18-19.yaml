openapi: 3.0.3
info:
  title: TruckerCore Phase 18–19 API
  version: 1.0.0
servers:
  - url: https://{env}.yourdomain.com
    variables:
      env: { default: stage, enum: [stage, app] }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
    ExportResult:
      type: object
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }
        format: { type: string, enum: [csv, json] }
    EsgCarbon:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals:
          type: object
          properties:
            fuel_gal: { type: number }
            co2e_kg: { type: number }
            idle_hours: { type: number }
        lanes:
          type: array
          items:
            type: object
            properties:
              lane: { type: string }
              co2e_kg: { type: number }
              miles: { type: number }
    FleetScorecard:
      type: object
      properties:
        org_id: { type: string }
        period: { type: string }
        divisions:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              safety_score: { type: number }
              on_time_pct: { type: number }
              fuel_efficiency: { type: number }
              rank: { type: integer }
    EsignEnvelope:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [created, sent, completed, voided] }
        recipients:
          type: array
          items:
            type: object
            properties:
              email: { type: string }
              role: { type: string }
        document_url: { type: string }
    RetentionPolicy:
      type: object
      properties:
        id: { type: string }
        scope: { type: string, enum: [logs, docs, analytics, pii] }
        region: { type: string }
        days: { type: integer }
        active: { type: boolean }
    DsrExport:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [user, org] }
        status: { type: string, enum: [queued, processing, ready, expired] }
        url: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
    DispatchOptimizeResult:
      type: object
      properties:
        assignments:
          type: array
          items:
            type: object
            properties:
              load_id: { type: string }
              driver_user_id: { type: string }
              score: { type: number }
              reasons: { type: array, items: { type: string } }
        metrics:
          type: object
          properties:
            on_time_pct: { type: number }
            total_miles: { type: number }
            empty_miles: { type: number }
    AssistantAction:
      type: object
      properties:
        id: { type: string }
        name: { type: string, enum: [ack_alert, create_coaching_task, recompute_eta] }
        status: { type: string, enum: [queued, completed, failed] }
        result: { type: object }
    YardPrediction:
      type: object
      properties:
        site_id: { type: string }
        date: { type: string, format: date }
        docks:
          type: array
          items:
            type: object
            properties:
              dock_id: { type: string }
              suggested_sequence: { type: array, items: { type: string } }
              utilization_pct: { type: number }
    OrgHierarchy:
      type: object
      properties:
        org_id: { type: string }
        parent_org_id: { type: string, nullable: true }
        children:
          type: array
          items: { type: string }
security:
  - bearerAuth: []
paths:
  # Load Board Syndication
  /api/syndication/loads/export:
    post:
      summary: Export loads for partner syndication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partner: { type: string }
                format: { type: string, enum: [csv, json], default: json }
                since: { type: string, format: date-time }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExportResult' } } } }
  /api/syndication/loads/ingest:
    post:
      summary: Ingest inbound load postings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partner: { type: string }
                payload: { type: object, additionalProperties: true }
      responses:
        '200': { description: OK }

  # Carbon & ESG
  /api/esg/carbon:
    get:
      summary: Emissions summary (CO2e) and lane breakdown
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EsgCarbon' } } } }
  /api/esg/export.csv:
    get:
      summary: Export ESG data as CSV
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string, format: binary } } } }

  # Carrier/Fleet Scorecards
  /api/fleet/scorecards:
    get:
      summary: Fleet-level scorecards
      parameters:
        - in: query
          name: period
          schema: { type: string, example: '30d' }
        - in: query
          name: division
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FleetScorecard' } } } }

  # Document eSigning
  /api/docs/esign/envelope:
    post:
      summary: Create and send eSigning envelope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_url, recipients]
              properties:
                document_url: { type: string }
                recipients:
                  type: array
                  items:
                    type: object
                    required: [email, role]
                    properties:
                      email: { type: string }
                      role: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EsignEnvelope' } } } }
  /api/docs/esign/webhook:
    post:
      summary: eSigning provider webhook
      responses:
        '200': { description: OK }

  # Data Retention & DSR
  /api/privacy/retention_policies:
    post:
      summary: Upsert retention policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionPolicy' }
      responses:
        '200': { description: OK }
    get:
      summary: List retention policies
      responses:
        '200': { description: OK }
  /api/privacy/dsr/export:
    post:
      summary: Request data export (user/org)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id]
              properties:
                kind: { type: string, enum: [user, org] }
                id: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DsrExport' } } } }
  /api/privacy/dsr/{export_id}:
    get:
      summary: Get export status/download
      parameters:
        - in: path
          name: export_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DsrExport' } } } }

  # Dispatch Optimizer
  /api/dispatch/optimize:
    post:
      summary: Optimize assignments across loads and drivers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loads, drivers]
              properties:
                loads: { type: array, items: { type: object } }
                drivers: { type: array, items: { type: object } }
                constraints: { type: object, additionalProperties: true }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DispatchOptimizeResult' } } } }

  # Assistant Skills Pack
  /api/assistant/actions:
    post:
      summary: Execute allowed assistant action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, params]
              properties:
                name: { type: string, enum: [ack_alert, create_coaching_task, recompute_eta] }
                params: { type: object, additionalProperties: true }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantAction' } } } }

  # Warehouse/Yard Flow
  /api/yard/predict:
    post:
      summary: Predict dock assignment and utilization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, date]
              properties:
                site_id: { type: string }
                date: { type: string, format: date }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/YardPrediction' } } } }

  # Multi-Org Branching
  /api/admin/orgs/hierarchy:
    get:
      summary: Get org hierarchy tree
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrgHierarchy' } } } }
